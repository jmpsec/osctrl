name: CI - Pull Requests

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/frontend-build.yml"
      - ".github/workflows/golangci-lint.yml"

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOLANG_VERSION: 1.27.3

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: true

      - name: Test (retry)
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=$1
            shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $attempts attempts: $*"
                return 1
              fi
              n=$((n + 1))
              sleep $((5 * n))
            done
          }
          retry 3 go test ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Snapshot build (single target sanity)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean --single-target

  # pkg/santa on the engines osctrl supports besides SQLite: every test runs on
  # its own schema (PostgreSQL) or database (MySQL). The DSNs also turn on the
  # optional real-engine tests elsewhere, such as pkg/dbutil.
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: osctrl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: osctrl_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OSCTRL_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=test dbname=osctrl_test sslmode=disable
      OSCTRL_TEST_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/osctrl_test?charset=utf8mb4&parseTime=True&loc=Local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: true

      - name: Santa on PostgreSQL
        run: go test -count=1 ./pkg/santa
        env:
          OSCTRL_TEST_SANTA_ENGINE: POSTGRES

      - name: Santa on MySQL
        run: go test -count=1 ./pkg/santa
        env:
          OSCTRL_TEST_SANTA_ENGINE: MYSQL

      - name: Index builds on both engines
        run: go test -count=1 ./pkg/dbutil
