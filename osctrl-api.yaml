          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "401":
