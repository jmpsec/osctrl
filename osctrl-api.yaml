    posture.ControlResult:
      properties:
        category:
          description: posture category the evidence came from
          type: string
        control_id:
          description: e.g. "A.8.24" or "CC6.6"
          type: string
        description:
          type: string
        detail:
          description: human-readable explanation
          type: string
        framework:
          $ref: "#/components/schemas/posture.Framework"
        max_score:
          description: >-
            MaxScore is the risk points this control would contribute if it

            failed outright (its weight). A passing control still reports this so

            callers can renormalize the total after excluding controls — e.g. the

            SPA's "what if I ignore this check" recompute — without needing the

            evaluation rules themselves.
          type: integer
        score:
          description: 0 = pass, otherwise earned risk points
          type: integer
        severity:
          $ref: "#/components/schemas/posture.Severity"
        status:
          description: '"pass", "warn", "fail"'
          type: string
        title:
          type: string
      type: object
