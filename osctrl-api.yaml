openapi: 3.0.0
info:
  contact:
    name: osctrl
    url: https://github.com/jmpsec/osctrl
  description: API service for osctrl, a fast and efficient osquery management solution.
  license:
    name: MIT
    url: https://github.com/jmpsec/osctrl/blob/master/LICENSE
  termsOfService: https://github.com/jmpsec/osctrl
  title: osctrl API
  version: 0.5.8
paths:
  /:
    get:
      description: Returns the API root liveness response.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
      summary: API root liveness check
      tags:
        - system
  /api/v1/alerts/apply:
    post:
      description: Queues a reload-alerts service command for osctrl-tls. The TLS
        process reloads its alert rule snapshot and resets the channel sender
        cache without restarting. The snapshot swap is atomic; in-flight matches
        finish against the old ruleset.
      responses:
        "202":
          description: Reload requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ServiceConfigApplyResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "503":
          description: Alerts disabled or service commands unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
      security:
        - ApiKeyAuth: []
      summary: Apply alert changes (hot reload)
      tags:
        - alerts
  /api/v1/alerts/channels:
    get:
      description: Returns alert channel rows. Secrets are redacted unless reveal=1 is
        passed by an admin.
      parameters:
        - description: Environment ID; omit to list all
          in: query
          name: env
          schema:
            type: integer
        - description: Pass 1 to include secret fields (admin only)
          in: query
          name: reveal
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/handlers.alertChannelDTO"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "503":
          description: Alerts disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
      security:
        - ApiKeyAuth: []
      summary: List alert channels
      tags:
        - alerts
    post:
      description: Creates a new notification channel. Config is validated against the
        channel type registry.
      requestBody:
        $ref: "#/components/requestBodies/types.AlertChannelCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.alertChannelDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
        "503":
          description: Alerts disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/types.ApiErrorResponse"
      security:
        - ApiKeyAuth: []
      summary: Create an alert channel
      tags:
        - alerts
