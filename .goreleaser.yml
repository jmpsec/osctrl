# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

dist: "./dist"

before:
  hooks:
    - go mod tidy
    - go mod download
    - sh deploy/cicd/package/generate-systemd-services.sh

builds:
  - id: osctrl-tls
    main: ./cmd/tls
    binary: "osctrl-tls-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}

  - id: osctrl-api
    main: ./cmd/api
    binary: "osctrl-api-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}

  - id: osctrl-cli
    main: ./cmd/cli
    binary: "osctrl-cli-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: osctrl
    allow_different_binary_count: true
    name_template: >-
      {{ .ProjectName }}-
      {{- title .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]
    ids:
      - osctrl-tls
      - osctrl-api
      - osctrl-cli
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot: {}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

# dockers_v2 replaces the old `dockers` + `docker_manifests` pair (both
# deprecated upstream). One entry per image: buildx builds every platform
# and pushes the multi-arch manifest list itself, so the per-arch `-amd64`
# / `-arm64` tags and the separate manifest-fuse step are gone — which also
# retires the `docker exporter does not currently support exporting
# manifest lists` failure those two sections existed to work around.
#
# GoReleaser stages the built binaries per platform in the build context
# ($TARGETPLATFORM/<binary>), so the Dockerfiles copy from there instead of
# from a flat dist/ path.
#
# sbom and provenance are pinned off to keep the published tags shaped
# exactly like the pre-migration ones: dockers_v2 defaults sbom to true,
# and the extra attestation manifests would show up under each tag, which
# the release workflow's cosign verification does not expect.
dockers_v2:
  - id: osctrl-tls
    images:
      - "{{ .Env.DOCKER_HUB_ORG }}/osctrl-tls"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: deploy/cicd/docker/Dockerfile-osctrl-tls
    ids:
      - osctrl-tls
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"

  - id: osctrl-api
    images:
      - "{{ .Env.DOCKER_HUB_ORG }}/osctrl-api"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: deploy/cicd/docker/Dockerfile-osctrl-api
    ids:
      - osctrl-api
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"

  - id: osctrl-cli
    images:
      - "{{ .Env.DOCKER_HUB_ORG }}/osctrl-cli"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: deploy/cicd/docker/Dockerfile-osctrl-cli
    ids:
      - osctrl-cli
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"

  # No Go binary: the image ships the pre-built Vite bundle (frontend/dist/)
  # produced before GoReleaser runs. `ids` stays empty so no binary is
  # staged into the context; extra_files pulls in the bundle, nginx configs,
  # and entrypoint the Dockerfile copies (paths stay relative to the
  # project root).
  - id: osctrl-frontend
    images:
      - "{{ .Env.DOCKER_HUB_ORG }}/osctrl-frontend"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: deploy/cicd/docker/Dockerfile-osctrl-frontend
    ids: []
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"
    extra_files:
      - frontend/dist
      - deploy/cicd/nginx/frontend.conf
      - deploy/cicd/nginx/frontend-tls.conf
      - deploy/cicd/nginx/docker-entrypoint-frontend.sh

docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

nfpms:
  - id: osctrl-tls
    ids:
      - osctrl-tls
    package_name: osctrl-tls
    maintainer: jmpsec/osctrl
    description: osctrl TLS component
    homepage: https://github.com/jmpsec/osctrl
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /opt/osctrl/bin
    contents:
      - src: ./dist/osctrl-tls-{{ .Os }}-{{ .Arch }}
        dst: /opt/osctrl/bin/osctrl-tls
      - src: deploy/config/tls.yml
        dst: /opt/osctrl/config/tls.yml.example
        file_info:
          mode: 0640
          owner: root
          group: osctrl
      - src: deploy/config/tls.yml
        dst: /opt/osctrl/config/tls.yml
        type: "config|noreplace"
        file_info:
          mode: 0640
          owner: root
          group: osctrl
      - src: ./tmp/goreleaser-package/osctrl-tls.service
        dst: /usr/lib/systemd/system/osctrl-tls.service
        file_info:
          mode: 0644
    scripts:
      preinstall: deploy/cicd/package/pre-install.sh
      postinstall: deploy/cicd/package/post-install.sh
      preremove: deploy/cicd/package/pre-remove-tls.sh
      postremove: deploy/cicd/package/post-remove.sh

  - id: osctrl-api
    ids:
      - osctrl-api
    package_name: osctrl-api
    maintainer: jmpsec/osctrl
    description: osctrl API component
    homepage: https://github.com/jmpsec/osctrl
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /opt/osctrl/bin
    contents:
      - src: ./dist/osctrl-api-{{ .Os }}-{{ .Arch }}
        dst: /opt/osctrl/bin/osctrl-api
      - src: deploy/config/api.yml
        dst: /opt/osctrl/config/api.yml.example
        file_info:
          mode: 0640
          owner: root
          group: osctrl
      - src: deploy/config/api.yml
        dst: /opt/osctrl/config/api.yml
        type: "config|noreplace"
        file_info:
          mode: 0640
          owner: root
          group: osctrl
      - src: ./tmp/goreleaser-package/osctrl-api.service
        dst: /usr/lib/systemd/system/osctrl-api.service
        file_info:
          mode: 0644
    scripts:
      preinstall: deploy/cicd/package/pre-install.sh
      postinstall: deploy/cicd/package/post-install.sh
      preremove: deploy/cicd/package/pre-remove-api.sh
      postremove: deploy/cicd/package/post-remove.sh

  - id: osctrl-cli
    ids:
      - osctrl-cli
    package_name: osctrl-cli
    maintainer: jmpsec/osctrl
    description: osctrl CLI component
    homepage: https://github.com/jmpsec/osctrl
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /opt/osctrl/bin
    contents:
      - src: ./dist/osctrl-cli-{{ .Os }}-{{ .Arch }}
        dst: /opt/osctrl/bin/osctrl-cli

release:
  draft: false
  prerelease: false
