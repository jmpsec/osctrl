# Config file for [Air](https://github.com/cosmtrek/air) in TOML format for osctrl-api

# Working directory
# . or absolute path, please note that the directories following must be under root
root = "."
tmp_dir = "/tmp"

[build]
  bin = "./bin/osctrl-api"
  cmd = "go build -ldflags \"-s -w -X main.buildCommit=$(git rev-parse HEAD) -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)\" -o /opt/osctrl/bin/osctrl-api /usr/src/app/cmd/api/*.go"
  # It's not necessary to trigger build each time file changes if it's too frequent.
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "deploy", "admin", "tls", "cli", "tools"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # Wrap in a restart loop so that when osctrl-api exits with code 1
  # (the "apply & restart" signal from the service-config endpoint),
  # the binary is re-run immediately. Air itself doesn't restart on
  # child exit — only on file changes — so the loop handles the restart
  # case. Exit code 0 (clean shutdown) breaks the loop so air can rebuild.
  full_bin = "cd /opt/osctrl && while ./bin/osctrl-api; [ $? -eq 1 ]; do echo 'osctrl-api exited with code 1 — restarting'; sleep 1; done"
  include_dir = []
  include_ext = ["go"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
